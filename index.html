<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <span class="badge">Ghanian Heritage</span>
        <p class="description">
        In Akan culture, children are traditionally named after the day of the week they are born. 
        Enter your details below to calculate your birth day and discover your authentic Akan name!
      </p>
    </header>
    <main class="container">
        <section class="card">
            <form id="akan-form">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="day">Day Of Birth </label>
                        <input 
                        type="number" 
                        id="day" 
                        name="day"
                        placeholder="DD (e.g. 18)"
                        min="1"
                        max="31"
                        required 
                        />
                    </div>
                </div>
            </form>
        </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>
